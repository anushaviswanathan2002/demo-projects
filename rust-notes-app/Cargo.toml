[package]
name = "rust-notes-app"
version = "0.1.0"
edition = "2021"
description = "A simple CLI notes-taking application"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.0", features = ["derive"] }
colored = "2.0"
uuid = { version = "1.0", features = ["v4"] }
dirs = "5.0"
anyhow = "1.0"
